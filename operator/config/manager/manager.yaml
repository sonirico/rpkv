apiVersion: apps/v1
kind: Deployment
metadata:
  name: rpkv-operator
  namespace: default
  labels:
    app.kubernetes.io/name: rpkv-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rpkv-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rpkv-operator
    spec:
      serviceAccountName: rpkv-operator
      containers:
        - name: rpkv-operator
          image: rpkv-operator:dev
          imagePullPolicy: IfNotPresent
