apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rpkv.fullname" . }}-router
  labels:
    {{- include "rpkv.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
spec:
  replicas: {{ .Values.router.replicas }}
  selector:
    matchLabels:
      {{- include "rpkv.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: router
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.service.port }}"
        prometheus.io/path: /metrics
      labels:
        {{- include "rpkv.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: router
    spec:
      containers:
        - name: rpkv
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: RPKV_MODE
              value: router
            - name: RPKV_SHARDS
              value: {{ include "rpkv.shardsList" . | quote }}
            - name: RPKV_LISTEN
              value: ":{{ .Values.service.port }}"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
